map "$request_method:$uri:$upstream_status:$upstream_http_cache_control" $rumi_public_image_cache_control {
    default no-store;
    "~^GET:/api/(pets|pet-skills)/[^/]+/image:(200|304):public, max-age=3600$" "public, max-age=3600";
}

server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate /opt/rumi-assistant/tls/config/live/example.com/fullchain.pem;
    ssl_certificate_key /opt/rumi-assistant/tls/config/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/rumi-assistant/current/rumi-market/frontend/dist;
    index index.html;
    access_log off;
    client_max_body_size 1m;
    send_timeout 330s;
    gzip off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /admin {
        return 404;
    }

    location ^~ /admin/ { return 404; }
    location = /api/admin { return 404; }
    location ^~ /api/admin/ { return 404; }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control $rumi_public_image_cache_control always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location = /api/pets {
        proxy_pass http://127.0.0.1:18082;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 330s;
        proxy_send_timeout 330s;
        proxy_buffering off;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1024;
        gzip_vary on;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        gzip on;
        gzip_types text/css application/javascript;
        gzip_min_length 1024;
        gzip_vary on;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~ ^/(runtime|samples|tools|backend|scripts|data|deploy)(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
