# Public encyclopedia only. No game backend or account endpoint is proxied.
server {
    listen 443 ssl;
    server_name example.com;

    ssl_certificate /opt/rumi-assistant/tls/config/live/example.com/fullchain.pem;
    ssl_certificate_key /opt/rumi-assistant/tls/config/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /opt/rumi-assistant/public-book-current;
    access_log off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control "no-cache" always;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    location = / { try_files /index.html =404; }
    location = /index.html { try_files $uri =404; }
    location = /app-icon.svg { try_files $uri =404; }
    location /assets/ { try_files $uri =404; }

    location = /api/pets {
        alias /opt/rumi-assistant/public-book-current/book-data/catalog.json;
        default_type application/json;
    }
    location ~ ^/api/pets/([1-9][0-9]*)$ {
        alias /opt/rumi-assistant/public-book-current/book-data/pets/$1.json;
        default_type application/json;
    }
    location ~ ^/api/pets/([1-9][0-9]*)/image$ {
        alias /opt/rumi-assistant/public-book-current/book-data/pet-images/$1.png;
        default_type image/svg+xml;
    }
    location ~ ^/api/pet-skills/([1-9][0-9]*)/image$ {
        alias /opt/rumi-assistant/public-book-current/book-data/skill-images/$1.png;
        default_type image/svg+xml;
    }

    # Includes the former /admin/, private files and every other /api/ path.
    location / { return 404; }
}
